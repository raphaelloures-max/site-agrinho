<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz – Entre Rios</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&display=swap" rel="stylesheet"/>
  <style>
    .quiz-section {
      background: var(--color-cream, #f5f0e8);
      padding: 2rem 0 5rem;
      min-height: 80vh;
    }
    .quiz-wrapper {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .quiz-header { text-align: center; }
    .quiz-header h1 {
      font-family: var(--font-display, 'Playfair Display', serif);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      color: var(--color-earth, #3a2510);
      margin: .3rem 0 .4rem;
    }
    .quiz-header p { color: var(--color-bark, #5a3e28); font-size: .95rem; }

    /* ── Barra de progresso ── */
    .quiz-progress {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }
    .quiz-progress__bar-bg {
      width: 100%;
      height: 8px;
      background: #d9cfc0;
      border-radius: 99px;
      overflow: hidden;
    }
    .quiz-progress__bar-fill {
      height: 100%;
      background: #c8973a;
      border-radius: 99px;
      transition: width .4s ease;
    }
    .quiz-progress__label {
      font-size: .8rem;
      color: var(--color-bark, #5a3e28);
      opacity: .75;
      text-align: right;
    }

    /* ── Card da pergunta ── */
    .quiz-card {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(58,37,16,.13);
      border: 2px solid #e8dcc8;
      padding: 2rem 2rem 1.6rem;
      animation: fadeUp .35s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .quiz-card__num {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #c8973a;
      margin-bottom: .7rem;
    }
    .quiz-card__question {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      color: #3a2510;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* ── Opções ── */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: .7rem;
    }
    .quiz-opt {
      width: 100%;
      text-align: left;
      background: #faf7f2;
      border: 2px solid #e0d5c4;
      border-radius: 10px;
      padding: .75rem 1.1rem;
      font-family: 'Source Serif 4', serif;
      font-size: .95rem;
      color: #3a2510;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .12s;
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    .quiz-opt:hover:not(:disabled) {
      border-color: #c8973a;
      background: #fdf6e8;
      transform: translateX(3px);
    }
    .quiz-opt .opt-letter {
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e8dcc8;
      color: #5a3e28;
      font-weight: 700;
      font-size: .82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .18s, color .18s;
    }
    .quiz-opt.correct {
      border-color: #3a8a2f;
      background: #edfae9;
    }
    .quiz-opt.correct .opt-letter {
      background: #3a8a2f;
      color: #fff;
    }
    .quiz-opt.wrong {
      border-color: #c0392b;
      background: #fdecea;
    }
    .quiz-opt.wrong .opt-letter {
      background: #c0392b;
      color: #fff;
    }
    .quiz-opt:disabled { cursor: default; transform: none; }

    /* ── Feedback ── */
    .quiz-feedback {
      margin-top: 1.1rem;
      padding: .85rem 1.1rem;
      border-radius: 10px;
      font-size: .9rem;
      line-height: 1.5;
      display: none;
    }
    .quiz-feedback.show { display: block; animation: fadeUp .25s ease; }
    .quiz-feedback.correct-fb {
      background: #edfae9;
      border-left: 4px solid #3a8a2f;
      color: #1e5219;
    }
    .quiz-feedback.wrong-fb {
      background: #fdecea;
      border-left: 4px solid #c0392b;
      color: #7a1e1e;
    }

    /* ── Botão próximo ── */
    .quiz-next {
      display: none;
      margin-top: 1.2rem;
      width: 100%;
      background: #c8973a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .75rem 1.5rem;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .quiz-next.show { display: block; animation: fadeUp .25s ease; }
    .quiz-next:hover { background: #e0a940; }

    /* ── Tela inicial ── */
    .quiz-start {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(58,37,16,.13);
      border: 2px solid #e8dcc8;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .quiz-start__icon { font-size: 3rem; margin-bottom: .8rem; }
    .quiz-start h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: #3a2510;
      margin-bottom: .6rem;
    }
    .quiz-start p { color: #5a3e28; font-size: .95rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .quiz-start__meta {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .quiz-start__meta span {
      background: #faf7f2;
      border: 1px solid #e0d5c4;
      border-radius: 8px;
      padding: .4rem .9rem;
      font-size: .85rem;
      color: #5a3e28;
    }
    .btn-quiz-start {
      background: #c8973a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .75rem 2.5rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-quiz-start:hover { background: #e0a940; }

    /* ── Tela de resultado ── */
    .quiz-result {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(58,37,16,.13);
      border: 2px solid #e8dcc8;
      padding: 2.5rem 2rem;
      text-align: center;
      animation: fadeUp .35s ease;
    }
    .quiz-result__emoji { font-size: 3.5rem; margin-bottom: .6rem; }
    .quiz-result h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #3a2510;
      margin-bottom: .5rem;
    }
    .quiz-result__score {
      font-size: 3rem;
      font-weight: 700;
      color: #c8973a;
      font-family: 'Playfair Display', serif;
      line-height: 1.1;
    }
    .quiz-result__score span { font-size: 1.2rem; color: #5a3e28; }
    .quiz-result__msg { color: #5a3e28; font-size: .95rem; margin: .8rem 0 1.5rem; line-height: 1.6; }
    .quiz-result__breakdown {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }
    .quiz-result__breakdown div {
      background: #faf7f2;
      border: 1px solid #e0d5c4;
      border-radius: 10px;
      padding: .6rem 1.2rem;
      font-size: .88rem;
      color: #5a3e28;
    }
    .quiz-result__breakdown strong { display: block; font-size: 1.4rem; color: #3a2510; }
    .btn-quiz-restart {
      background: #c8973a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .75rem 2.2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-quiz-restart:hover { background: #e0a940; }
  </style>
</head>
<body>

  <div class="a11y-bar" role="toolbar" aria-label="Ferramentas de acessibilidade">

    <button class="a11y-btn" id="btn-font-inc" aria-label="Aumentar tamanho da fonte">A+</button>

              aria-controls="nav-menu" aria-label="Abrir menu de navegação">

      <nav id="nav-menu" class="navbar__nav" role="navigation" aria-label="Navegação principal">

    <section class="quiz-section">

  <script src="script.js"></script>
  <script>
  (function(){
    const QUESTIONS = [
      {
        q: 'Em que ano as primeiras famílias suábias chegaram à região de Guarapuava para fundar Entre Rios?',
        opts: ['1945', '1951', '1962', '1970'],
        answer: 1,
        feedback: 'Em maio de 1951, as primeiras 500 famílias suábias chegaram à região delimitada pelos rios Jordão e Pinhão, fundando as cinco colônias de Entre Rios.'
      },
      {
        q: 'Quantas colônias formam o distrito de Entre Rios?',
        opts: ['Três', 'Quatro', 'Cinco', 'Seis'],
        answer: 2,
        feedback: 'Entre Rios é formado por cinco colônias: Vitória, Jordãozinho, Cachoeira, Socorro e Samambaia.'
      },
      {
        q: 'Qual engenheiro agrônomo liderou a vinda dos suábios ao Brasil e presidiu a Cooperativa Agrária?',
        opts: ['Hans Mueller', 'Michael Moor', 'Johann Weber', 'Karl Bauer'],
        answer: 1,
        feedback: 'Michael Moor foi o engenheiro agrônomo responsável por selecionar as famílias e as terras em Guarapuava, tornando-se o primeiro presidente da Cooperativa Agrária.'
      },
      {
        q: 'De qual região da Europa vieram os Suábios do Danúbio antes de chegarem ao Brasil?',
        opts: ['França e Alemanha', 'Polônia e Ucrânia', 'Hungria, Croácia e Romênia', 'Áustria e Suíça'],
        answer: 2,
        feedback: 'Os Suábios do Danúbio eram descendentes de colonizadores alemães que se estabeleceram no sudeste europeu — especialmente na Hungria, Croácia e Romênia — no século XVIII.'
      },
      {
        q: 'Em que década a AGRÁRIA foi pioneira na adoção do sistema de plantio direto no Brasil?',
        opts: ['1960s', '1970s', '1980s', '1990s'],
        answer: 1,
        feedback: 'Na década de 1970, técnicos da AGRÁRIA e agricultores locais desenvolveram e adotaram o plantio direto, técnica que hoje cobre dezenas de milhões de hectares no Brasil.'
      },
      {
        q: 'Qual é a principal contribuição da Agrária Malte para o Brasil?',
        opts: [
          'É a maior fábrica de farinha do país',
          'É a maior maltaria da América Latina, abastecendo as principais cervejarias',
          'É responsável por 60% da exportação de soja',
          'Produz etanol para o mercado nacional'
        ],
        answer: 1,
        feedback: 'A Agrária Malte, localizada em Grandes Rios (PR), é a maior maltaria da América Latina, responsável por cerca de 30% da demanda nacional de malte.'
      },
      {
        q: 'Que percentual da área do distrito de Entre Rios é coberto por vegetação nativa?',
        opts: ['Mais de 10%', 'Mais de 20%', 'Mais de 30%', 'Mais de 50%'],
        answer: 2,
        feedback: 'Mais de 30% da área do distrito é coberta por vegetação nativa, superando as exigências do Código Florestal Brasileiro.'
      },
      {
        q: 'Qual é o objetivo da FAPA (Fundação Agrária de Pesquisa Agropecuária)?',
        opts: [
          'Organizar festivais culturais suábios',
          'Desenvolver variedades adaptadas ao clima subtropical de Guarapuava',
          'Administrar o sistema de saúde das colônias',
          'Exportar trigo para a Europa'
        ],
        answer: 1,
        feedback: 'A FAPA desenvolve variedades de trigo, cevada, soja e milho adaptadas ao clima subtropical de Guarapuava, elevando a produtividade sem ampliar a área plantada.'
      },
      {
        q: 'Em que ano o distrito de Entre Rios foi oficialmente criado por lei estadual?',
        opts: ['1951', '1955', '1962', '1970'],
        answer: 2,
        feedback: 'Pela lei estadual nº 4.583, de 27 de junho de 1962, o distrito de Entre Rios foi oficialmente criado e anexado ao município de Guarapuava.'
      },
      {
        q: 'Qual ODS (Objetivo de Desenvolvimento Sustentável) da ONU está diretamente relacionado ao modelo de Entre Rios?',
        opts: ['ODS 1 – Erradicação da Pobreza', 'ODS 2 – Fome Zero e Agricultura Sustentável', 'ODS 7 – Energia Limpa', 'ODS 13 – Ação Climática'],
        answer: 1,
        feedback: 'O projeto de Entre Rios tem como base a ODS 2 – Fome Zero e Agricultura Sustentável, que busca acabar com a fome, alcançar segurança alimentar e promover a agricultura sustentável.'
      },
      {
        q: 'Quais são as principais culturas agrícolas de Entre Rios?',
        opts: [
          'Café, cana-de-açúcar e algodão',
          'Arroz, feijão e mandioca',
          'Soja, milho, trigo e cevada',
          'Uva, maçã e pêssego'
        ],
        answer: 2,
        feedback: 'As culturas principais de Entre Rios são soja, milho, trigo e cevada, com rotação obrigatória entre elas para preservar a saúde do solo.'
      },
      {
        q: 'Qual organização coordena a preservação do patrimônio cultural suábio em Entre Rios desde 2001?',
        opts: [
          'Cooperativa AGRÁRIA',
          'Prefeitura de Guarapuava',
          'Fundação Cultural Suábio-Brasileira (FCSB)',
          'Instituto do Patrimônio Histórico do Paraná'
        ],
        answer: 2,
        feedback: 'A Fundação Cultural Suábio-Brasileira (FCSB), criada em 2001 na Colônia Vitória, coordena a preservação do patrimônio cultural suábio, incluindo festivais, gastronomia e arquitetura enxaimel.'
      },
    ];

    const LETTERS = ['A', 'B', 'C', 'D'];

    let current = 0;
    let score = 0;
    let answered = false;
    let wrongCount = 0;

    const app = document.getElementById('quiz-app');

    function getResultData(s, total) {
      const pct = s / total;
      if (pct === 1)   return { emoji: '🏆', title: 'Perfeito!', msg: 'Você domina a história de Entre Rios! Conhecimento completo sobre os suábios, a AGRÁRIA e a agricultura sustentável.' };
      if (pct >= 0.75) return { emoji: '🌾', title: 'Muito bem!', msg: 'Ótimo conhecimento sobre Entre Rios! Revise a história e agricultura para alcançar a pontuação máxima.' };
      if (pct >= 0.5)  return { emoji: '📚', title: 'Bom começo!', msg: 'Você sabe bastante, mas há detalhes sobre a história e práticas agrícolas para explorar. Que tal ler a aba História?' };
      return { emoji: '🌱', title: 'Continue aprendendo!', msg: 'Entre Rios tem uma história rica. Explore as páginas do site para conhecer mais sobre os suábios e a AGRÁRIA!' };
    }

    function renderStart() {
      app.innerHTML = `
        <div class="quiz-start">
          <div class="quiz-start__icon">🌾</div>
          <h2>Quanto você sabe sobre Entre Rios?</h2>
          <p>Responda ${QUESTIONS.length} perguntas sobre a história, agricultura e cultura dos Suábios do Danúbio no Paraná.</p>
          <div class="quiz-start__meta">
            <span>📋 ${QUESTIONS.length} perguntas</span>
            <span>🏆 1 ponto por acerto</span>
            <span>💡 Explicação em cada resposta</span>
          </div>
          <button class="btn-quiz-start" id="btn-begin">▶ &nbsp;Começar Quiz</button>
        </div>`;
      document.getElementById('btn-begin').addEventListener('click', () => {
        current = 0; score = 0; answered = false; wrongCount = 0;
        renderQuestion();
      });
    }

    function renderQuestion() {
      const q = QUESTIONS[current];
      const total = QUESTIONS.length;
      const pct = ((current) / total) * 100;

      app.innerHTML = `
        <div class="quiz-progress">
          <div class="quiz-progress__bar-bg">
            <div class="quiz-progress__bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="quiz-progress__label">Pergunta ${current + 1} de ${total}</div>
        </div>
        <div class="quiz-card">
          <div class="quiz-card__num">Pergunta ${current + 1} / ${total}</div>
          <div class="quiz-card__question">${q.q}</div>
          <div class="quiz-options" id="opts">
            ${q.opts.map((opt, i) => `
              <button class="quiz-opt" data-i="${i}">
                <span class="opt-letter">${LETTERS[i]}</span>
                ${opt}
              </button>`).join('')}
          </div>
          <div class="quiz-feedback" id="feedback"></div>
          <button class="quiz-next" id="btn-next">
            ${current + 1 < total ? 'Próxima pergunta →' : 'Ver resultado →'}
          </button>
        </div>`;

      document.querySelectorAll('.quiz-opt').forEach(btn => {
        btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i)));
      });
      document.getElementById('btn-next').addEventListener('click', () => {
        current++;
        if (current < QUESTIONS.length) renderQuestion();
        else renderResult();
      });
    }

    function handleAnswer(chosen) {
      if (answered) return;
      answered = true;
      const q = QUESTIONS[current];
      const correct = q.answer;
      const feedback = document.getElementById('feedback');
      const nextBtn = document.getElementById('btn-next');

      document.querySelectorAll('.quiz-opt').forEach((btn, i) => {
        btn.disabled = true;
        if (i === correct) btn.classList.add('correct');
        if (i === chosen && chosen !== correct) btn.classList.add('wrong');
      });

      if (chosen === correct) {
        score++;
        feedback.className = 'quiz-feedback correct-fb show';
        feedback.innerHTML = `<strong>✅ Correto!</strong> ${q.feedback}`;
      } else {
        wrongCount++;
        feedback.className = 'quiz-feedback wrong-fb show';
        feedback.innerHTML = `<strong>❌ Incorreto.</strong> A resposta certa é <strong>${LETTERS[correct]} – ${q.opts[correct]}</strong>. ${q.feedback}`;
      }

      nextBtn.classList.add('show');
      answered = true;
    }

    function renderResult() {
      const total = QUESTIONS.length;
      const res = getResultData(score, total);
      app.innerHTML = `
        <div class="quiz-result">
          <div class="quiz-result__emoji">${res.emoji}</div>
          <h2>${res.title}</h2>
          <div class="quiz-result__score">${score}<span> / ${total}</span></div>
          <p class="quiz-result__msg">${res.msg}</p>
          <div class="quiz-result__breakdown">
            <div><strong style="color:#3a8a2f">${score}</strong> acertos</div>
            <div><strong style="color:#c0392b">${wrongCount}</strong> erros</div>
            <div><strong style="color:#c8973a">${Math.round((score/total)*100)}%</strong> aproveitamento</div>
          </div>
          <button class="btn-quiz-restart" id="btn-restart">↺ &nbsp;Tentar novamente</button>
        </div>`;
      document.getElementById('btn-restart').addEventListener('click', renderStart);
    }

    renderStart();
  })();
  </script>
</body>
